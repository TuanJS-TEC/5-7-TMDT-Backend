server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — tránh 502 sau khi restart (nginx không cache IP cũ của api-gateway)
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Chuyển tiếp tới API Gateway (prefix /api giữ nguyên đường dẫn)
  location /api {
    set $api_upstream http://api-gateway:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ảnh upload từ listing/auth được lưu ở service tương ứng và đi qua gateway
  location /uploads {
    set $api_upstream http://api-gateway:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
