name: Mobile CI

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'libs/api-contract/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'libs/api-contract/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build -w @car-marketplace/api-contract
      - run: npm run typecheck -w mobile
